[project]
name = "Warrant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "groq>=1.6.0",
    "httpx>=0.28.1",
    "model2vec>=0.9.0",
    "packaging>=26.3",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warrant"]
